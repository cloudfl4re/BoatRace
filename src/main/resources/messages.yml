room-starting: "<green>比赛正在准备发车……</green>"
room-staging-failed: "<red>发车准备失败，比赛已回到等待状态：</red> <gray>{reason}</gray>"
room-cancelled: "<yellow>比赛 <white>{code}</white> 已取消。</yellow>"
room-expired: "<yellow>比赛 <white>{code}</white> 因长时间无操作自动取消。</yellow>"
room-status: "<aqua><bold>比赛 {code}</bold></aqua> <dark_gray>•</dark_gray> <gray>赛道 <white>{track}</white> <dark_gray>•</dark_gray> 状态 <white>{state}</white> <dark_gray>•</dark_gray> 人数 <white>{players}/{capacity}</white></gray>"
