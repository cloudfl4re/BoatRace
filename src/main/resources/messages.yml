# BoatRace 默认消息（MiniMessage）
# 颜色格式：推荐 MiniMessage；兼容 &2、§e 等传统颜色代码。
# 占位符使用 {name}，由插件自动转义。修改后执行 /race reload 生效。

prefix: "<dark_gray>[</dark_gray><gradient:#55FFAA:#55AAFF><bold>BoatRace</bold></gradient><dark_gray>]</dark_gray> "

# 通用
initializing: "<yellow>插件正在准备赛道数据，请稍候再试。</yellow>"
no-permission: "<red>你没有权限执行这项操作。</red>"
player-only: "<red>该指令只能由玩家执行。</red>"
unknown-command: "<red>无法识别这条指令。</red> <gray>输入 <white>/race help</white> 查看可用命令。</gray>"
invalid-number: "<red>请输入有效数字。</red>"
invalid-index: "<red>序号超出有效范围。</red>"

