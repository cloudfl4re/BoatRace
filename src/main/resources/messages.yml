track-deleted: "<green>赛道 <white>{track}</white> 已删除。</green>"
track-delete-confirm: "<yellow>这是不可逆操作。</yellow> <gray>再次执行 <white>/race track delete {track} confirm</white> 确认删除。</gray>"
track-list-empty: "<yellow>还没有创建赛道。</yellow>"
track-list-header: "<aqua><bold>可用赛道</bold></aqua>"
