name: BoatRace
version: "${version}"
main: cn.cloudfl4re.boatrace.BoatRacePlugin
description: Lophine/Folia ${targetApi} ice boat racing and time trial plugin
authors: [cloudfl4re, xWtree]
api-version: '${targetApi}'
folia-supported: true
softdepend: [PlaceholderAPI]
commands:
  race:
    description: BoatRace main command
    usage: /race help
    permission: boatrace.use
permissions:
  boatrace.use:
    description: Use BoatRace player commands
    default: true
  boatrace.create:
    description: Create BoatRace rooms
    default: true
  boatrace.admin:
    description: Manage BoatRace tracks and rooms
    default: op
  boatrace.gui:
    description: Open the BoatRace GUI
    default: true
  boatrace.gui.race:
    description: View race status and leaderboards in the GUI
    default: true
  boatrace.gui.control:
    description: Control active races from the GUI
    default: op
  boatrace.gui.track:
    description: Manage BoatRace tracks from the GUI
    default: op
  boatrace.gui.view:
    description: Edit BoatRace GUI layouts
    default: op
