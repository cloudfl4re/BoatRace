name: BoatRaceIntegrationHarness
version: '1.2.0'
main: cn.cloudfl4re.boatrace.harness.BotHarnessPlugin
description: BoatRace Lophine/Folia integration harness
authors: [cloudfl4re, xWtree]
api-version: '${targetApi}'
folia-supported: true
commands:
  brtest:
    description: Dispatch a command as a test player
    permission: boatrace.harness
  brloc:
    description: Print a test player's vehicle location
    permission: boatrace.harness
permissions:
  boatrace.harness:
    default: op
